<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Container Background -->
  <rect width="800" height="500" rx="20" fill="#FFF5F5"/>
  
  <!-- Browser Window Shell -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="48" rx="16" fill="#FFE4E6"/>
  <circle cx="48" cy="44" r="7" fill="#EF4444"/>
  <circle cx="70" cy="44" r="7" fill="#F59E0B"/>
  <circle cx="92" cy="44" r="7" fill="#10B981"/>
  <rect x="130" y="34" width="340" height="20" rx="10" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
  <text x="145" y="48" font-family="sans-serif" font-size="11" font-weight="600" fill="#E11D48">https://risemaru.oscarchair.jp/resume-crm</text>

  <!-- Sidebar -->
  <rect x="36" y="84" width="160" height="380" rx="12" fill="#FFF1F2"/>
  <rect x="52" y="104" width="128" height="32" rx="8" fill="#E11D48"/>
  <text x="116" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RISEマル CRM</text>
  
  <!-- Sidebar Menu Items -->
  <rect x="52" y="152" width="128" height="24" rx="6" fill="#FECDD3"/>
  <text x="64" y="168" font-family="sans-serif" font-size="11" font-weight="bold" fill="#BE123C">📄 JIS履歴書 Engine</text>
  <rect x="52" y="188" width="128" height="24" rx="6" fill="#FFFFFF"/>
  <text x="64" y="204" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280">💼 応募・顧客管理</text>
  <rect x="52" y="224" width="128" height="24" rx="6" fill="#FFFFFF"/>
  <text x="64" y="240" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280">🤖 AI求人マッチ診断</text>

  <!-- Main Content Areas: Resume & Pipeline Split -->
  <!-- Left Side: JIS Resume Preview -->
  <g transform="translate(216, 84)">
    <rect x="0" y="0" width="260" height="366" rx="12" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <!-- Resume Header -->
    <rect x="16" y="16" width="160" height="20" fill="#FFE4E6" rx="4"/>
    <text x="24" y="31" font-family="sans-serif" font-size="12" font-weight="extrabold" fill="#BE123C">履歴書 (JIS規格 PDF)</text>
    
    <!-- Photo Box -->
    <rect x="192" y="16" width="52" height="68" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1" rx="4"/>
    <circle cx="218" cy="42" r="14" fill="#FDA4AF"/>
    <path d="M202 74 Q218 56 234 74" fill="#FDA4AF"/>

    <!-- Resume Rows -->
    <rect x="16" y="52" width="160" height="10" fill="#F3F4F6" rx="3"/>
    <rect x="16" y="70" width="160" height="10" fill="#F3F4F6" rx="3"/>
    
    <line x1="16" y1="96" x2="244" y2="96" stroke="#FECDD3" stroke-width="1"/>
    <text x="16" y="112" font-family="sans-serif" font-size="11" font-weight="bold" fill="#111827">職歴・主な実績 (AI生成テキスト)</text>
    <rect x="16" y="122" width="228" height="8" fill="#F9FAFB" rx="2"/>
    <rect x="16" y="136" width="210" height="8" fill="#F9FAFB" rx="2"/>
    <rect x="16" y="150" width="220" height="8" fill="#F9FAFB" rx="2"/>
    
    <!-- Match Score Tag -->
    <rect x="16" y="180" width="228" height="60" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="28" y="202" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857">求人AI適合度スコア</text>
    <text x="28" y="230" font-family="sans-serif" font-size="22" font-weight="900" fill="#059669">88% <tspan font-size="11" font-weight="bold">(最適化完了)</tspan></text>
  </g>

  <!-- Right Side: Solo-preneur Pipeline Cards -->
  <g transform="translate(492, 84)">
    <rect x="0" y="0" width="268" height="366" rx="12" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#BE123C">ソロプレナー顧客・案件ボード</text>

    <!-- Pipeline Card 1 -->
    <rect x="16" y="50" width="236" height="88" rx="8" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
    <text x="28" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">株式会社マルプラス</text>
    <text x="28" y="90" font-family="sans-serif" font-size="11" fill="#4B5563">初期開発 &amp; DevSecOps支援</text>
    <rect x="28" y="104" width="70" height="20" rx="4" fill="#D1FAE5"/>
    <text x="63" y="118" font-family="sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">成約・進行中</text>

    <!-- Pipeline Card 2 -->
    <rect x="16" y="152" width="236" height="88" rx="8" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
    <text x="28" y="174" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">AIパートナー企業 B社</text>
    <text x="28" y="192" font-family="sans-serif" font-size="11" fill="#4B5563">データ計測基盤構築アドバイス</text>
    <rect x="28" y="206" width="70" height="20" rx="4" fill="#DBEAFE"/>
    <text x="63" y="220" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1E40AF" text-anchor="middle">商談・見積提示</text>
  </g>

<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle brand color -->
  <rect width="800" height="450" rx="24" fill="#F0E7F5"/>
  
  <!-- Data Pipeline Elements -->
  <!-- Main flow path -->
  <path d="M100 225H200L250 175H350L400 275H500L550 225H700" stroke="#2D1B4D" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 15"/>
  
  <!-- BigQuery / GA4 Core Node -->
  <rect x="350" y="150" width="100" height="150" rx="12" fill="#2D1B4D"/>
  <rect x="365" y="165" width="70" height="70" rx="8" fill="#D4AF37"/>
  <rect x="365" y="245" width="70" height="15" rx="4" fill="#A8A9AD" fill-opacity="0.5"/>
  <rect x="365" y="270" width="40" height="15" rx="4" fill="#A8A9AD" fill-opacity="0.5"/>
  
  <!-- Input Nodes -->
  <circle cx="200" cy="225" r="30" fill="white" stroke="#2D1B4D" stroke-width="2"/>
  <path d="M190 225H210M200 215V235" stroke="#2D1B4D" stroke-width="2"/>
  
  <!-- Data Points (Animated appearance) -->
  <circle cx="275" cy="175" r="8" fill="#D4AF37">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="475" cy="275" r="8" fill="#D4AF37">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Dashboard Representation -->
  <rect x="580" y="150" width="150" height="150" rx="16" fill="white" stroke="#2D1B4D" stroke-width="2" style="filter: drop-shadow(0px 10px 20px rgba(45, 27, 77, 0.1));"/>
  <rect x="600" y="170" width="110" height="12" rx="4" fill="#2D1B4D" fill-opacity="0.1"/>
  <rect x="600" y="195" width="50" height="50" rx="8" fill="#D4AF37" fill-opacity="0.8"/>
  <rect x="660" y="195" width="50" height="50" rx="8" fill="#2D1B4D" fill-opacity="0.6"/>
  <rect x="600" y="255" width="110" height="30" rx="4" fill="#A8A9AD" fill-opacity="0.2"/>
  
  <!-- Glowing effects -->
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 225) rotate(90) scale(200)">
      <stop stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="225" r="200" fill="url(#glow)"/>
</svg>

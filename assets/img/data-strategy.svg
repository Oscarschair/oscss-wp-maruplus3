<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="#F0E7F5"/>
  
  <defs>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="dbGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BA9423"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#BA9423"/>
    </linearGradient>
  </defs>

  <!-- Process Headers -->
  <text x="160" y="80" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#2D1B4D" opacity="0.4">COLLECT</text>
  <text x="400" y="80" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#2D1B4D" opacity="0.4">ANALYZE</text>
  <text x="640" y="80" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#2D1B4D" opacity="0.4">ACTIVATE</text>

  <!-- Connecting Lines (Animated) -->
  <path d="M220 225 H 330" stroke="#2D1B4D" stroke-width="2" stroke-dasharray="8 6" opacity="0.1">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M470 225 H 580" stroke="#2D1B4D" stroke-width="2" stroke-dasharray="8 6" opacity="0.1">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Left Side: Source Icons -->
  <g transform="translate(110, 150)" filter="url(#subtleShadow)">
    <circle cx="50" cy="75" r="70" fill="white" stroke="#2D1B4D" stroke-width="1.5"/>
    <!-- Aligned Dots (Raw Data) -->
    <circle cx="30" cy="40" r="4" fill="#2D1B4D" opacity="0.2"/>
    <circle cx="50" cy="35" r="4" fill="#2D1B4D" opacity="0.2"/>
    <circle cx="70" cy="40" r="4" fill="#2D1B4D" opacity="0.2"/>
    <!-- Aligned Bars -->
    <rect x="25" y="85" width="14" height="30" rx="3" fill="#D4AF37"/>
    <rect x="43" y="65" width="14" height="50" rx="3" fill="#D4AF37"/>
    <rect x="61" y="75" width="14" height="40" rx="3" fill="#D4AF37"/>
    <text x="50" y="165" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#2D1B4D">Raw Data</text>
  </g>

  <!-- Center Piece: Data Hub (3D Database) -->
  <g transform="translate(340, 160)" filter="url(#subtleShadow)">
    <rect width="120" height="130" rx="20" fill="#2D1B4D"/>
    <!-- Modern 3D Database Cylinder -->
    <g transform="translate(35, 25)">
       <!-- Bottom Cylinder -->
       <ellipse cx="25" cy="65" rx="25" ry="8" fill="#BA9423"/>
       <rect x="0" y="45" width="50" height="20" fill="url(#dbGradient)"/>
       <ellipse cx="25" cy="45" rx="25" ry="8" fill="#D4AF37" stroke="#2D1B4D" stroke-width="0.5"/>
       
       <!-- Middle Cylinder -->
       <rect x="0" y="27" width="50" height="15" fill="url(#dbGradient)"/>
       <ellipse cx="25" cy="27" rx="25" ry="8" fill="#D4AF37" stroke="#2D1B4D" stroke-width="0.5"/>
       
       <!-- Top Cylinder -->
       <rect x="0" y="10" width="50" height="15" fill="url(#dbGradient)"/>
       <ellipse cx="25" cy="10" rx="25" ry="8" fill="#FFF2CC" stroke="#2D1B4D" stroke-width="0.5"/>
    </g>
    <text x="60" y="155" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#2D1B4D">Database</text>
  </g>

  <!-- Right Side: Dashboard (Centered Widgets) -->
  <g transform="translate(580, 150)" filter="url(#subtleShadow)">
    <rect width="140" height="140" rx="16" fill="white" stroke="#2D1B4D" stroke-width="2"/>
    <!-- Centered Contents Container -->
    <g transform="translate(15, 15)">
      <!-- Top Row -->
      <g transform="translate(5, 5)">
        <!-- Pie Chart -->
        <path d="M 20 20 L 20 0 A 20 20 0 0 1 40 20 Z" fill="#D4AF37"/>
        <circle cx="20" cy="20" r="20" fill="#D4AF37" fill-opacity="0.3"/>
      </g>
      <g transform="translate(60, 5)">
        <!-- Line Chart -->
        <rect width="45" height="40" rx="4" fill="#2D1B4D" opacity="0.05"/>
        <path d="M 5 30 L 15 15 L 25 25 L 40 5" stroke="#2D1B4D" stroke-width="2" fill="none" opacity="0.6"/>
      </g>
      <!-- Bottom Row -->
      <g transform="translate(5, 55)">
        <!-- Multi Bar Chart -->
        <rect width="100" height="50" rx="4" fill="#2D1B4D" opacity="0.05"/>
        <rect x="10" y="30" width="10" height="15" fill="#D4AF37"/>
        <rect x="25" y="15" width="10" height="30" fill="#2D1B4D" opacity="0.6"/>
        <rect x="40" y="25" width="10" height="20" fill="#D4AF37"/>
        <rect x="55" y="10" width="10" height="35" fill="#2D1B4D" opacity="0.6"/>
        <rect x="70" y="20" width="10" height="25" fill="#D4AF37"/>
        <rect x="85" y="5" width="10" height="40" fill="#2D1B4D" opacity="0.6"/>
      </g>
    </g>
    <text x="70" y="165" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#2D1B4D">Dashboard</text>
  </g>

  <!-- Footer Description -->
  <text x="400" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2D1B4D" opacity="0.8">データの収集から蓄積、多角的な分析・可視化までの流れ</text>
</svg>

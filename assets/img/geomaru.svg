<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Container Background -->
  <rect width="800" height="500" rx="20" fill="#FAF5FC"/>
  
  <!-- Browser Window Shell -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="48" rx="16" fill="#F3E8FF"/>
  <circle cx="48" cy="44" r="7" fill="#EF4444"/>
  <circle cx="70" cy="44" r="7" fill="#F59E0B"/>
  <circle cx="92" cy="44" r="7" fill="#10B981"/>
  <rect x="130" y="34" width="340" height="20" rx="10" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="145" y="48" font-family="sans-serif" font-size="11" font-weight="600" fill="#7E22CE">https://geomaru.oscarchair.jp/dashboard</text>

  <!-- Sidebar -->
  <rect x="36" y="84" width="160" height="380" rx="12" fill="#F8F5FC"/>
  <rect x="52" y="104" width="128" height="32" rx="8" fill="#7E22CE"/>
  <text x="116" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GEOマル AI診断</text>
  
  <!-- Sidebar Menu Items -->
  <rect x="52" y="152" width="128" height="24" rx="6" fill="#E9D5FF"/>
  <text x="64" y="168" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6B21A8">🤖 AIクローラー</text>
  <rect x="52" y="188" width="128" height="24" rx="6" fill="#FFFFFF"/>
  <text x="64" y="204" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280">🔗 Canonical監査</text>
  <rect x="52" y="224" width="128" height="24" rx="6" fill="#FFFFFF"/>
  <text x="64" y="240" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280">📝 メタタグ判定</text>
  <rect x="52" y="260" width="128" height="24" rx="6" fill="#FFFFFF"/>
  <text x="64" y="276" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280">📊 構造化データ</text>

  <!-- Main Content Dashboard Area -->
  <!-- Top Stat Cards -->
  <g transform="translate(216, 84)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="80" rx="12" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <text x="16" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6B7280">GEO AIスコア</text>
    <text x="16" y="60" font-family="sans-serif" font-size="26" font-weight="900" fill="#7E22CE">94 <tspan font-size="14" font-weight="bold">/100</tspan></text>
    <circle cx="136" cy="40" r="18" fill="#E9D5FF"/>
    <path d="M130 40 L134 44 L142 36" stroke="#7E22CE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Card 2 -->
    <rect x="186" y="0" width="170" height="80" rx="12" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <text x="202" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6B7280">GPTBotアクセス</text>
    <text x="202" y="60" font-family="sans-serif" font-size="22" font-weight="900" fill="#10B981">ALLOW <tspan font-size="12" font-weight="bold">(許可)</tspan></text>

    <!-- Card 3 -->
    <rect x="372" y="0" width="172" height="80" rx="12" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <text x="388" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6B7280">Canonical 監査</text>
    <text x="388" y="60" font-family="sans-serif" font-size="22" font-weight="900" fill="#7E22CE">100% 正常</text>
  </g>

  <!-- Large Graph & Chart Mockup -->
  <g transform="translate(216, 180)">
    <rect x="0" y="0" width="544" height="270" rx="12" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1F1122">GEO / SEOAI 可視化推移グラフ (30日間)</text>
    
    <!-- Grid lines -->
    <line x1="20" y1="70" x2="524" y2="70" stroke="#F3E8FF" stroke-width="1"/>
    <line x1="20" y1="120" x2="524" y2="120" stroke="#F3E8FF" stroke-width="1"/>
    <line x1="20" y1="170" x2="524" y2="170" stroke="#F3E8FF" stroke-width="1"/>
    <line x1="20" y1="220" x2="524" y2="220" stroke="#F3E8FF" stroke-width="1"/>

    <!-- Chart Path Gradient -->
    <defs>
      <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7E22CE" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    
    <path d="M 40 200 Q 120 180 180 130 T 320 100 T 440 75 T 504 60 L 504 220 L 40 220 Z" fill="url(#purpleGrad)"/>
    <path d="M 40 200 Q 120 180 180 130 T 320 100 T 440 75 T 504 60" fill="none" stroke="#7E22CE" stroke-width="4" stroke-linecap="round"/>

    <!-- Data points -->
    <circle cx="180" cy="130" r="5" fill="#7E22CE" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="320" cy="100" r="5" fill="#7E22CE" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="440" cy="75" r="5" fill="#7E22CE" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="504" cy="60" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
